<h2 class="sr-only">Mobile app screen with a yes or no toggle asking whether the user has locked in a base term life policy while premiums are still cheapest for their age</h2>
<style>
@keyframes drift { 0% { opacity:0; transform:translateY(14px);} 100% { opacity:1; transform:translateY(0);} }
.i-1 { animation: drift 0.5s ease 0.1s both; }
.i-2 { animation: drift 0.5s ease 0.35s both; }
.i-3 { animation: drift 0.5s ease 0.6s both; }
</style>

<div style="display:flex; justify-content:center; padding:1rem 0; background:var(--surface-1); border-radius:12px;">
<div style="width:280px; height:560px; border-radius:28px; border:0.5px solid var(--border-strong); background:var(--surface-2); padding:20px 20px; box-sizing:border-box; display:flex; flex-direction:column;">
  <div style="display:flex; justify-content:space-between; font-size:12px; color:var(--text-muted); margin-bottom:8px;"><span>9:41</span><i class="ti ti-wifi" aria-hidden="true"></i></div>

  <div style="flex:1; display:flex; flex-direction:column; justify-content:center; gap:18px;">

    <i class="ti ti-ghost" style="font-size:26px; color:var(--text-accent);" aria-hidden="true"></i>

    <p class="i-1" style="font-size:16px; font-weight:500; margin:0; line-height:1.5;">Have you locked in a base Term Life policy while your premiums are still at their cheapest for your age?</p>

    <div class="i-2" style="display:flex; gap:10px;">
      <button style="flex:1; height:50px; border-radius:12px; border:1.5px solid var(--border-accent); background:var(--bg-accent); color:var(--text-accent); font-size:14px; font-weight:500;">Yes</button>
      <button style="flex:1; height:50px; border-radius:12px; border:1.5px solid var(--border); background:var(--surface-1); color:var(--text-secondary); font-size:14px; font-weight:500;">No</button>
    </div>

  </div>

  <button class="i-3" style="width:100%; height:46px; border-radius:var(--radius); background:var(--fill-primary); color:var(--on-primary); border:none; font-size:14px; font-weight:500;">Analyze my exposure</button>
</div>
</div>
