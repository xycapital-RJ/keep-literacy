<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Screen 10a — No Income Right Now</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
* { box-sizing: border-box; }
body { margin:0; font-family: var(--font-body); background:#f0f0ee; display:flex; align-items:center; justify-content:center; min-height:100vh; }
.phone { width:375px; height:780px; background:var(--surface-2); border-radius:40px; border:1px solid var(--border-strong); box-shadow:0 20px 60px rgba(0,0,0,0.12); padding:24px 22px; display:flex; flex-direction:column; }
.statusbar { display:flex; justify-content:space-between; font-size:13px; color:var(--text-muted); margin-bottom:10px; }
.content { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; text-align:center; padding:0 8px; }
@keyframes drift { 0% { opacity:0; transform:translateY(14px);} 100% { opacity:1; transform:translateY(0);} }
.n1 { animation: drift .5s ease .1s both; }
.n2 { animation: drift .5s ease .4s both; }
.n3 { animation: drift .5s ease .7s both; }
button.cta { width:100%; height:54px; border-radius:var(--radius); background:var(--fill-primary); color:var(--on-primary); border:none; font-size:16px; font-weight:500; cursor:pointer; }
</style></head>
<body>
<div class="phone">
  <div class="statusbar"><span>9:41</span><i class="ti ti-wifi"></i></div>
  <div class="content">
    <i class="ti ti-mood-smile" style="font-size:34px; color:var(--text-success);"></i>
    <p class="n1" style="font-size:18px; font-weight:500; margin:0; max-width:250px; line-height:1.5;">Totally fine — you don't need income to learn this.</p>
    <div class="n2" style="background:var(--surface-1); border-radius:14px; padding:14px 18px; display:flex; align-items:center; gap:12px; text-align:left;">
      <i class="ti ti-replace" style="font-size:20px; color:var(--text-accent);"></i>
      <p style="font-size:13.5px; color:var(--text-secondary); margin:0; line-height:1.5;">We'll use a placeholder number to show how the math works — swap in your real numbers later.</p>
    </div>
  </div>
  <button class="n3 cta">Show me with an example</button>
</div>
</body></html>
