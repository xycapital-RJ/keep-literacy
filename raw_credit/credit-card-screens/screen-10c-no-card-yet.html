<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Screen 10c — No, Not Yet</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
* { box-sizing: border-box; }
body { margin:0; font-family: var(--font-body); background:#f0f0ee; display:flex; align-items:center; justify-content:center; min-height:100vh; }
.phone { width:375px; height:780px; background:var(--surface-2); border-radius:40px; border:1px solid var(--border-strong); box-shadow:0 20px 60px rgba(0,0,0,0.12); padding:24px 22px; display:flex; flex-direction:column; }
.statusbar { display:flex; justify-content:space-between; font-size:13px; color:var(--text-muted); margin-bottom:10px; }
.content { flex:1; display:flex; flex-direction:column; justify-content:center; gap:18px; }
@keyframes drift { 0% { opacity:0; transform:translateY(14px);} 100% { opacity:1; transform:translateY(0);} }
.j1 { animation: drift .5s ease .1s both; }
.j2 { animation: drift .5s ease .4s both; }
.j3 { animation: drift .5s ease .7s both; }
button.cta { width:100%; height:54px; border-radius:var(--radius); background:var(--fill-primary); color:var(--on-primary); border:none; font-size:16px; font-weight:500; cursor:pointer; }
</style></head>
<body>
<div class="phone">
  <div class="statusbar"><span>9:41</span><i class="ti ti-wifi"></i></div>
  <div class="content">
    <i class="ti ti-wallet" style="font-size:28px; color:var(--text-success);"></i>
    <p class="j1" style="font-size:18px; font-weight:500; margin:0; line-height:1.4;">No card yet, no problem.</p>
    <p class="j1" style="font-size:14.5px; color:var(--text-secondary); margin:-8px 0 0;">What's your monthly income right now?</p>
    <div class="j2" style="border:1.5px solid var(--border-accent); border-radius:var(--radius); padding:15px 18px; display:flex; align-items:center; gap:10px;">
      <span style="font-size:22px; color:var(--text-muted);">₹</span>
      <span style="font-size:22px; font-weight:500;">15,000</span>
    </div>
    <p class="j3" style="font-size:13px; color:var(--text-muted); margin:0;">Pocket money, salary, freelance — just the total.</p>
  </div>
  <button class="j3 cta">Estimate my first limit</button>
</div>
</body></html>
