<h2 class="sr-only">Screen with a number input asking the maximum amount the user can realistically invest every month without fail</h2>
<style>
@keyframes drift { 0% { opacity:0; transform:translateY(14px);} 100% { opacity:1; transform:translateY(0);} }
.s1 { animation: drift .5s ease .1s both; }
.s2 { animation: drift .5s ease .35s both; }
.s3 { animation: drift .5s ease .6s both; }
</style>

<div style="display:flex; justify-content:center; padding:1rem 0;">
<div style="width:270px; height:560px; border-radius:28px; border:0.5px solid var(--border-strong); background:var(--surface-2); padding:22px; box-sizing:border-box; display:flex; flex-direction:column; justify-content:center; gap:22px; text-align:center;">

  <i class="ti ti-calendar-repeat" style="font-size:28px; color:var(--text-accent); margin:0 auto;" aria-hidden="true"></i>

  <p class="s1" style="font-size:17px; font-weight:500; margin:0; line-height:1.5; max-width:220px; margin-left:auto; margin-right:auto;">What's the maximum amount you can realistically invest every month, without fail?</p>

  <div class="s2" style="border:1.5px solid var(--border-accent); border-radius:var(--radius); padding:16px 18px; display:flex; align-items:center; justify-content:center; gap:6px;">
    <span style="font-family: Georgia, serif; font-size:26px; color:var(--text-muted);">&#8377;</span>
    <span style="font-family: Georgia, serif; font-size:32px; font-weight:700;">5,000</span>
    <span style="width:2px; height:26px; background:var(--text-accent); margin-left:2px;"></span>
  </div>

  <p style="font-size:11.5px; color:var(--text-muted); margin:-8px 0 0;">Realistic beats ambitious — you can always raise it later.</p>

  <button class="s3" style="width:100%; height:50px; border-radius:var(--radius); background:var(--fill-primary); color:var(--on-primary); border:none; font-size:15px; font-weight:500; margin-top:6px;">Next</button>

</div>
</div>
