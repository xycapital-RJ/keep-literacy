<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Screen 5 — The Shield of the Credit Card</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
* { box-sizing: border-box; }
body { margin:0; font-family: var(--font-body); background:#f0f0ee; display:flex; align-items:center; justify-content:center; min-height:100vh; }
.phone { width:375px; height:780px; background:var(--surface-2); border-radius:40px; border:1px solid var(--border-strong); box-shadow:0 20px 60px rgba(0,0,0,0.12); padding:24px 22px; display:flex; flex-direction:column; }
.statusbar { display:flex; justify-content:space-between; font-size:13px; color:var(--text-muted); margin-bottom:10px; }
.content { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; text-align:center; }

@keyframes drift { 0% { opacity:0; transform:translateY(14px);} 100% { opacity:1; transform:translateY(0);} }
@keyframes arrowFly { 0% { transform:translateX(-90px); opacity:0;} 55% { opacity:1;} 70% { transform:translateX(8px);} 100% { transform:translateX(-6px); opacity:1;} }
@keyframes shieldFlash { 0%, 60% { filter:drop-shadow(0 0 0 transparent);} 68% { filter:drop-shadow(0 0 8px var(--text-accent));} 100% { filter:drop-shadow(0 0 0 transparent);} }
.arrow { animation: arrowFly 1.6s cubic-bezier(.3,.7,.4,1) .3s infinite; font-size:26px; color:var(--text-danger); position:absolute; left:0; }
.shield { animation: shieldFlash 1.6s ease .3s infinite; font-size:48px; color:var(--text-accent); position:absolute; right:18px; }
.seq1 { animation: drift .5s ease .1s both; }
.seq2 { animation: drift .5s ease 1.1s both; }
.shield-wrap { position:relative; width:110px; height:90px; display:flex; align-items:center; justify-content:center; overflow:hidden; }
</style></head>
<body>
<div class="phone">
  <div class="statusbar"><span>9:41</span><i class="ti ti-wifi"></i></div>
  <div class="content">
    <p class="seq1" style="font-size:17px; font-weight:500; margin:0; max-width:260px; line-height:1.5;">Swipe a credit card, and you're spending the bank's money.</p>
    <div class="shield-wrap">
      <i class="ti ti-shield-check shield"></i>
      <i class="ti ti-arrow-narrow-right arrow"></i>
    </div>
    <p class="seq2" style="font-size:14px; color:var(--text-secondary); margin:0; max-width:260px; line-height:1.6;">If fraud happens, the bank's money is stolen, not yours. They fight to fix it — your checking account stays untouched.</p>
  </div>
</div>
</body></html>
