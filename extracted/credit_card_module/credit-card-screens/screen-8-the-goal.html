<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Screen 8 — The Goal</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
* { box-sizing: border-box; }
body { margin:0; font-family: var(--font-body); background:#f0f0ee; display:flex; align-items:center; justify-content:center; min-height:100vh; }
.phone { width:375px; height:780px; background:var(--surface-2); border-radius:40px; border:1px solid var(--border-strong); box-shadow:0 20px 60px rgba(0,0,0,0.12); padding:24px 22px; display:flex; flex-direction:column; }
.statusbar { display:flex; justify-content:space-between; font-size:13px; color:var(--text-muted); margin-bottom:10px; }
.content { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; text-align:center; }

@keyframes drift { 0% { opacity:0; transform:translateY(14px);} 100% { opacity:1; transform:translateY(0);} }
@keyframes unlock { 0%, 55% { transform:rotate(0deg);} 100% { transform:rotate(-28deg);} }
.shackle { transform-origin:30% 100%; animation: unlock 1.4s ease .6s infinite alternate; }
.seq1 { animation: drift .5s ease .1s both; }
.seq2 { animation: drift .5s ease .4s both; }
.seq3 { animation: drift .5s ease 1.3s both; }
button.cta { width:100%; height:54px; border-radius:var(--radius); background:var(--fill-primary); color:var(--on-primary); border:none; font-size:16px; font-weight:500; cursor:pointer; }
</style></head>
<body>
<div class="phone">
  <div class="statusbar"><span>9:41</span><i class="ti ti-wifi"></i></div>
  <div class="content">
    <svg width="60" height="66" viewBox="0 0 50 56">
      <path class="shackle" d="M14 24 V16 A11 11 0 0 1 36 16 V24" stroke="var(--text-primary)" stroke-width="4" fill="none" stroke-linecap="round"/>
      <rect x="8" y="24" width="34" height="26" rx="5" fill="var(--surface-1)" stroke="var(--text-primary)" stroke-width="2"/>
    </svg>
    <p class="seq1" style="font-size:17px; font-weight:500; margin:0; max-width:270px; line-height:1.5;">By the end of this scroll, you'll know exactly how to be a Transactor.</p>
    <p class="seq2" style="font-size:14px; color:var(--text-secondary); margin:0; max-width:260px; line-height:1.55;">Including the one number that decides whether you ever pay interest at all.</p>
  </div>
  <button class="seq3 cta">Let's calculate yours</button>
</div>
</body></html>
