<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Screen 10 — The Branch</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
* { box-sizing: border-box; }
body { margin:0; font-family: var(--font-body); background:#f0f0ee; display:flex; align-items:center; justify-content:center; min-height:100vh; }
.phone { width:375px; height:780px; background:var(--surface-2); border-radius:40px; border:1px solid var(--border-strong); box-shadow:0 20px 60px rgba(0,0,0,0.12); padding:24px 22px; display:flex; flex-direction:column; }
.statusbar { display:flex; justify-content:space-between; font-size:13px; color:var(--text-muted); margin-bottom:10px; }
.content { flex:1; display:flex; flex-direction:column; justify-content:center; gap:16px; }

@keyframes drift { 0% { opacity:0; transform:translateY(14px);} 100% { opacity:1; transform:translateY(0);} }
.d1 { animation: drift .5s ease .1s both; }
.d2 { animation: drift .5s ease .35s both; }
.d3 { animation: drift .5s ease .6s both; }
.d4 { animation: drift .5s ease .85s both; }
.opt { width:100%; text-align:left; height:64px; border-radius:14px; background:var(--surface-1); border:0.5px solid var(--border); padding:0 16px; display:flex; align-items:center; gap:14px; cursor:pointer; font-size:15px; font-weight:500; color:var(--text-primary); font-family:var(--font-body); }
.opt i { font-size:20px; }
</style></head>
<body>
<div class="phone">
  <div class="statusbar"><span>9:41</span><i class="ti ti-wifi"></i></div>
  <div class="content">
    <p class="d1" style="font-size:20px; font-weight:500; margin:0 0 6px;">Do you already have a credit card?</p>
    <button class="opt d2"><i class="ti ti-credit-card" style="color:var(--text-accent);"></i>Yes, I have one</button>
    <button class="opt d3"><i class="ti ti-wallet" style="color:var(--text-success);"></i>No, but I have income or pocket money</button>
    <button class="opt d4"><i class="ti ti-hourglass-empty" style="color:var(--text-muted);"></i>No, and I don't have income right now</button>
  </div>
  <p style="font-size:12px; color:var(--text-muted); text-align:center; margin:12px 0 0;">Whatever you pick, there's a real answer for you next</p>
</div>
</body></html>
