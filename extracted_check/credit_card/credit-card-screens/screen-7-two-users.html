<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Screen 7 — Two Types of Users</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
* { box-sizing: border-box; }
body { margin:0; font-family: var(--font-body); background:#f0f0ee; display:flex; align-items:center; justify-content:center; min-height:100vh; }
.phone { width:375px; height:780px; background:var(--surface-2); border-radius:40px; border:1px solid var(--border-strong); box-shadow:0 20px 60px rgba(0,0,0,0.12); padding:24px 22px; display:flex; flex-direction:column; }
.statusbar { display:flex; justify-content:space-between; font-size:13px; color:var(--text-muted); margin-bottom:10px; }
.content { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:24px; text-align:center; }

@keyframes drift { 0% { opacity:0; transform:translateY(14px);} 100% { opacity:1; transform:translateY(0);} }
@keyframes drawShort { 0% { stroke-dashoffset:140;} 100% { stroke-dashoffset:0;} }
@keyframes drawLoop { 0% { stroke-dashoffset:300;} 100% { stroke-dashoffset:0;} }
.path-short { stroke-dasharray:140; animation: drawShort 1s ease .5s both; }
.path-loop { stroke-dasharray:300; animation: drawLoop 1.6s ease .5s both; }
.seq1 { animation: drift .5s ease .1s both; }
.seq2 { animation: drift .5s ease .4s both; }
</style></head>
<body>
<div class="phone">
  <div class="statusbar"><span>9:41</span><i class="ti ti-wifi"></i></div>
  <div class="content">
    <div style="display:flex; flex-direction:column; gap:18px; align-items:center;">
      <div style="display:flex; align-items:center; gap:14px;">
        <svg width="90" height="28" viewBox="0 0 90 28"><path class="path-short" d="M2 14 H88" stroke="var(--text-success)" stroke-width="4" fill="none" stroke-linecap="round"/></svg>
        <span style="font-size:13px; color:var(--text-success); font-weight:600;">Transactor</span>
      </div>
      <div style="display:flex; align-items:center; gap:14px;">
        <svg width="90" height="36" viewBox="0 0 90 36"><path class="path-loop" d="M2 18 H50 A12 12 0 1 1 50 19 H88" stroke="var(--text-danger)" stroke-width="4" fill="none" stroke-linecap="round"/></svg>
        <span style="font-size:13px; color:var(--text-danger); font-weight:600;">Revolver</span>
      </div>
    </div>
    <p class="seq1" style="font-size:16px; font-weight:500; margin:0; max-width:260px; line-height:1.5;">Transactors pay their full bill every time — interest-free, always.</p>
    <p class="seq2" style="font-size:14px; color:var(--text-secondary); margin:0; max-width:260px; line-height:1.6;">Revolvers carry a balance and quietly fund the bank's profit margin with their own stress.</p>
  </div>
</div>
</body></html>
