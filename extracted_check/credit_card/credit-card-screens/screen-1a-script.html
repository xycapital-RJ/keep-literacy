<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Screen 1A — The Script</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
* { box-sizing: border-box; }
body { margin:0; font-family: var(--font-body); background:#f0f0ee; display:flex; align-items:center; justify-content:center; min-height:100vh; }
.phone { width:375px; height:780px; background:var(--surface-2); border-radius:40px; border:1px solid var(--border-strong); box-shadow:0 20px 60px rgba(0,0,0,0.12); padding:24px 22px; display:flex; flex-direction:column; }
.statusbar { display:flex; justify-content:space-between; font-size:13px; color:var(--text-muted); margin-bottom:10px; }
.content { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:24px; text-align:center; padding:0 10px; }

@keyframes drift { 0% { opacity:0; transform:translateY(14px);} 100% { opacity:1; transform:translateY(0);} }
@keyframes assemble1 { 0% { transform:translate(-56px,-28px) rotate(-25deg); opacity:0;} 100% { transform:translate(0,0) rotate(0deg); opacity:1;} }
@keyframes assemble2 { 0% { transform:translate(56px,-20px) rotate(20deg); opacity:0;} 100% { transform:translate(0,0) rotate(0deg); opacity:1;} }
@keyframes assemble3 { 0% { transform:translate(-40px,36px) rotate(15deg); opacity:0;} 100% { transform:translate(0,0) rotate(0deg); opacity:1;} }
@keyframes assemble4 { 0% { transform:translate(48px,32px) rotate(-18deg); opacity:0;} 100% { transform:translate(0,0) rotate(0deg); opacity:1;} }
.pc1 { animation: assemble1 0.6s cubic-bezier(.22,1,.36,1) .1s both; }
.pc2 { animation: assemble2 0.6s cubic-bezier(.22,1,.36,1) .18s both; }
.pc3 { animation: assemble3 0.6s cubic-bezier(.22,1,.36,1) .26s both; }
.pc4 { animation: assemble4 0.6s cubic-bezier(.22,1,.36,1) .34s both; }
.f1 { animation: drift .5s ease .55s both; }
.f2 { animation: drift .5s ease .85s both; }

.pieces { position:relative; width:90px; height:60px; }
.piece { position:absolute; width:44px; height:28px; background:var(--surface-1); border:1.5px solid var(--border-strong); border-radius:5px; }
.quote { font-size:15px; color:var(--text-secondary); font-style:italic; margin:0; max-width:260px; line-height:1.55; }
.main { font-family: var(--font-voice); font-size:24px; line-height:1.5; margin:0; max-width:270px; }
</style></head>
<body>
<div class="phone">
  <div class="statusbar"><span>9:41</span><i class="ti ti-wifi"></i></div>
  <div class="content">
    <div class="pieces">
      <div class="piece pc1" style="top:0;left:0;"></div>
      <div class="piece pc2" style="top:0;right:0;"></div>
      <div class="piece pc3" style="bottom:0;left:0;"></div>
      <div class="piece pc4" style="bottom:0;right:0;"></div>
    </div>
    <p class="f1 quote">"Credit cards are evil. They'll ruin your life. Stick to debit."</p>
    <p class="f2 main">It sounds like safe advice. It's actually a financial trap.</p>
  </div>
</div>
</body></html>
