<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><title>Screen 10b — Yes, I Have One</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
* { box-sizing: border-box; }
body { margin:0; font-family: var(--font-body); background:#f0f0ee; display:flex; align-items:center; justify-content:center; min-height:100vh; }
.phone { width:375px; height:780px; background:var(--surface-2); border-radius:40px; border:1px solid var(--border-strong); box-shadow:0 20px 60px rgba(0,0,0,0.12); padding:24px 22px; display:flex; flex-direction:column; }
.statusbar { display:flex; justify-content:space-between; font-size:13px; color:var(--text-muted); margin-bottom:10px; }
.content { flex:1; display:flex; flex-direction:column; justify-content:center; gap:20px; }
@keyframes drift { 0% { opacity:0; transform:translateY(14px);} 100% { opacity:1; transform:translateY(0);} }
.i1 { animation: drift .5s ease .1s both; }
.i2 { animation: drift .5s ease .4s both; }
.i3 { animation: drift .5s ease .7s both; }
button.cta { width:100%; height:54px; border-radius:var(--radius); background:var(--fill-primary); color:var(--on-primary); border:none; font-size:16px; font-weight:500; cursor:pointer; }
</style></head>
<body>
<div class="phone">
  <div class="statusbar"><span>9:41</span><i class="ti ti-wifi"></i></div>
  <div class="content">
    <i class="ti ti-credit-card" style="font-size:28px; color:var(--text-accent);"></i>
    <p class="i1" style="font-size:20px; font-weight:500; margin:0;">What's your credit limit?</p>
    <div class="i2" style="border:1.5px solid var(--border-accent); border-radius:var(--radius); padding:15px 18px; display:flex; align-items:center; gap:10px;">
      <span style="font-size:22px; color:var(--text-muted);">₹</span>
      <span style="font-size:22px; font-weight:500;">50,000</span>
    </div>
    <p class="i3" style="font-size:13px; color:var(--text-muted); margin:0;">Check your card's app or your last statement if you're not sure.</p>
  </div>
  <button class="i3 cta">Calculate my number</button>
</div>
</body></html>
