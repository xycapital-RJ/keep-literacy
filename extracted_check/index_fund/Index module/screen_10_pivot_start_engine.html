<h2 class="sr-only">Screen prompting the user to start the compounding engine to see what happens when time combines with a simple index fund</h2>
<style>
@keyframes drift { 0% { opacity:0; transform:translateY(14px);} 100% { opacity:1; transform:translateY(0);} }
.s1 { animation: drift .5s ease .1s both; }
.s2 { animation: drift .5s ease .4s both; }
.s3 { animation: drift .5s ease .7s both; }
@keyframes gearSpin { 0% { transform:rotate(0deg);} 100% { transform:rotate(360deg);} }
.gear-spin { animation: gearSpin 6s linear infinite; }
</style>

<div style="display:flex; justify-content:center; padding:1rem 0;">
<div style="width:270px; height:560px; border-radius:28px; border:0.5px solid var(--border-strong); background:#171717; padding:22px; box-sizing:border-box; display:flex; flex-direction:column; justify-content:center; gap:22px; text-align:center;">

  <i class="ti ti-settings gear-spin" style="font-size:44px; color:#4F7CFF; margin:0 auto;" aria-hidden="true"></i>

  <p class="s1" style="font-size:22px; font-weight:500; line-height:1.4; margin:0; color:#fff; max-width:220px; margin-left:auto; margin-right:auto;">Stop reading. Let's fire up the engine.</p>

  <p class="s2" style="font-size:14px; color:#fff; opacity:0.75; margin:0; max-width:210px; margin-left:auto; margin-right:auto; line-height:1.55;">See exactly what happens when you combine time with a simple index fund.</p>

  <button class="s3" style="width:100%; height:52px; border-radius:10px; background:#fff; color:#171717; border:none; font-size:15px; font-weight:600; margin-top:6px;">Start the Engine</button>

</div>
</div>
